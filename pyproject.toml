[project]
name = "aeon_binary_to_arrow"
version = "0.1.0"
description = "Converts ephys, clock and hubclock binary files from the bonsai-onix system into compressed arrow files. These generated files should match the output from the bonsai-onix system with the arrow format is selected."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aeon-mecha",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "spikeinterface>=0.105.1",
]

[tool.uv.sources]
aeon-mecha = { path = "../aeon_mecha" }
